<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240" fill="none" role="img">
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}

.sc{animation:sc 1.6s linear infinite}@keyframes sc{to{stroke-dashoffset:-48}}
@keyframes sc2{to{stroke-dashoffset:48}}.scan{animation:scan 3.2s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(130px)}}.bx{animation:bx 3.2s ease-in-out infinite}@keyframes bx{0%,100%{opacity:1}45%,60%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#2a2a27" stroke-width="1"/></pattern>
<clipPath id="cp"><rect x=".5" y=".5" width="299" height="239" rx="16"/></clipPath></defs>
<rect x=".5" y=".5" width="299" height="239" rx="16" fill="#161614" stroke="#2a2a27"/>
<g clip-path="url(#cp)"><rect width="300" height="150" fill="#101010"/><rect width="300" height="150" fill="url(#g)" opacity=".8"/>

<path d="M62 150L136 8H164L238 150Z" fill="#ff5a1f" opacity=".07"><animate attributeName="opacity" values=".04;.12;.04" dur="3s" repeatCount="indefinite"/></path>
<path d="M62 150L136 8M238 150L164 8" stroke="#ff5a1f" stroke-width="2"/>
<line class="sc" x1="150" y1="156" x2="150" y2="4" stroke="#f3efe8" stroke-width="2" stroke-dasharray="14 10" style="animation-name:sc2"/>
<g class="bx"><path d="M126 52V44H134M166 44H174V52M174 84V92H166M134 92H126V84" stroke="#ff5a1f" stroke-width="2"/>
<rect x="136" y="58" width="28" height="22" rx="4" stroke="#f3efe8"/><path d="M140 80v4M160 80v4" stroke="#f3efe8"/>
<text class="m" x="126" y="38" font-size="8.5" letter-spacing="1" fill="#ff5a1f">VEHICLE 0.97</text></g>
<line class="scan" x1="0" y1="10" x2="300" y2="10" stroke="#ff5a1f" stroke-width="1.5" opacity=".6"/>
<text class="m" x="20" y="28" font-size="8.5" letter-spacing="1.5" fill="#a09b90">LANE · SIGN · VEHICLE</text>
<circle cx="14" cy="25" r="3" fill="#ff5a1f"/>

<line x1="0" y1="150" x2="300" y2="150" stroke="#2a2a27"/></g>
<text class="m" x="20" y="176" font-size="10" letter-spacing="2" fill="#a09b90">MACHINE PERCEPTION</text>
<text x="20" y="203" font-size="21" font-weight="700" letter-spacing="-.5" fill="#f3efe8">Computer vision suite</text>
<text class="m" x="20" y="226" font-size="10.5" letter-spacing="1" fill="#ff5a1f">PYTHON · TENSORFLOW · OPENCV</text>

</svg>