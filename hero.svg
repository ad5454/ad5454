<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none" role="img">
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}

.sp{transform-origin:790px 160px;animation:rot 40s linear infinite}
.sp2{transform-origin:790px 160px;animation:rot 24s linear infinite reverse}
.orb{transform-origin:790px 160px;animation:rot 9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.t{opacity:0;animation:cyc 12s infinite}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}22%{opacity:1;transform:none}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.core{transform-origin:790px 160px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.lb{opacity:.35;animation:lb 6s infinite}
@keyframes lb{0%,30%{opacity:.35}10%,20%{opacity:1}}
@keyframes lb1{0%{opacity:1}33%{opacity:.3}100%{opacity:.3}}
.l1{animation:l 6s infinite 0s}.l2{animation:l 6s infinite 2s}.l3{animation:l 6s infinite 4s}
@keyframes l{0%{opacity:1}30%{opacity:1}34%{opacity:.3}100%{opacity:.3}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#2a2a27" stroke-width="1"/></pattern>
<radialGradient id="fade" cx="75%" cy="50%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="mk"><rect width="1000" height="320" fill="url(#fade)"/></mask>
</defs>
<rect x=".5" y=".5" width="999" height="319" rx="22" fill="#0e0e0d" stroke="#2a2a27"/>
<rect width="1000" height="320" rx="22" fill="url(#g)" mask="url(#mk)" opacity=".7"/>
<circle cx="60" cy="58" r="4" fill="#ff5a1f"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text class="m" x="76" y="62" font-size="12" letter-spacing="3" fill="#a09b90">ROBOTICS · COMPUTER VISION · MECHATRONICS</text>
<text x="56" y="146" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#f3efe8">Aaditya Nair</text>
<text x="58" y="186" font-size="24" font-weight="500" fill="#ff5a1f">Mechatronics Engineer</text>
<line x1="58" y1="212" x2="420" y2="212" stroke="#2a2a27"/>
<line x1="58" y1="212" x2="118" y2="212" stroke="#ff5a1f" stroke-width="2"><animate attributeName="x2" values="78;420;78" dur="12s" repeatCount="indefinite"/></line>
<text class="m" x="58" y="254" font-size="17" fill="#ff5a1f">$</text>
<g class="m" font-size="17" fill="#f3efe8">
<text class="t m" x="80" y="254" style="animation-delay:0s">I build machines that see.</text>
<text class="t m" x="80" y="254" style="animation-delay:3s">I build machines that think.</text>
<text class="t m" x="80" y="254" style="animation-delay:6s">I build machines that move.</text>
<text class="t m" x="80" y="254" style="animation-delay:9s">Autonomous robots, CAD to code.</text>
</g>
<!-- rings -->
<g class="sp" opacity=".4"><circle cx="790" cy="160" r="128" stroke="#f3efe8" stroke-dasharray="2 9"/></g>
<g class="sp2" opacity=".75"><circle cx="790" cy="160" r="98" stroke="#ff5a1f" stroke-dasharray="44 16"/></g>
<circle cx="790" cy="160" r="66" stroke="#f3efe8" opacity=".5"/>
<path d="M790 20V300M650 160H930" stroke="#f3efe8" opacity=".12"/>
<g class="orb"><circle cx="918" cy="160" r="5" fill="#ff5a1f"/><circle cx="918" cy="160" r="11" stroke="#ff5a1f" opacity=".4"/></g>
<rect x="760" y="130" width="60" height="60" rx="14" fill="#161614" stroke="#ff5a1f" stroke-width="1.5"/>
<circle cx="790" cy="160" r="16" fill="#0e0e0d"/>
<circle class="core" cx="790" cy="160" r="7" fill="#ff5a1f"/>
<g class="m" font-size="11" letter-spacing="2" fill="#f3efe8">
<text class="l1" x="852" y="84">SENSE</text><text class="l2" x="652" y="248">PLAN</text><text class="l3" x="858" y="256">ACT</text>
</g>

</svg>